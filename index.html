
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>saibuilds.dev — Building...</title>

  <style>
    :root {
      --bg: #090b10;
      --terminal: #0d1017;
      --border: #202633;
      --text: #d7dce5;
      --muted: #727b8c;
      --cyan: #62e6ff;
      --green: #7df2a8;
      --purple: #a78bfa;
      --red: #ff6b81;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      background:
        radial-gradient(
          circle at 50% 40%,
          rgba(98, 230, 255, 0.055),
          transparent 35%
        ),
        var(--bg);

      color: var(--text);
      font-family:
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        "Fira Code",
        monospace;

      overflow: hidden;
    }

    /* Subtle terminal texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.025;

      background-image:
        linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);

      background-size: 50px 50px;
    }

    .terminal {
      width: min(900px, 100%);
      min-height: 500px;

      background: rgba(13, 16, 23, 0.94);
      border: 1px solid var(--border);
      border-radius: 12px;

      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.55),
        0 0 80px rgba(98, 230, 255, 0.035);

      overflow: hidden;
    }

    .terminal-header {
      height: 46px;
      display: flex;
      align-items: center;
      padding: 0 16px;

      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.015);
    }

    .dots {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #303642;
    }

    .terminal-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);

      color: var(--muted);
      font-size: 12px;
    }

    .terminal-body {
      padding: 52px clamp(24px, 6vw, 70px);
    }

    .prompt {
      color: var(--green);
    }

    .command {
      color: var(--text);
    }

    .intro {
      margin-bottom: 42px;
      line-height: 1.8;
    }

    .brand {
      margin-top: 8px;

      font-size: clamp(28px, 5vw, 52px);
      font-weight: 600;
      letter-spacing: -2px;

      color: #f4f7fb;

      text-shadow:
        0 0 30px rgba(98, 230, 255, 0.08);
    }

    .brand span {
      color: var(--cyan);
    }

    .role {
      margin-top: 10px;
      color: var(--muted);
      font-size: clamp(12px, 2vw, 15px);
    }

    .status {
      margin-top: 55px;
      line-height: 2;
      font-size: clamp(12px, 1.8vw, 14px);
    }

    .status-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .success {
      color: var(--green);
    }

    .warning {
      color: var(--purple);
    }

    .comment {
      color: var(--muted);
    }

    .joke {
      margin-top: 8px;
      color: var(--text);
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 17px;
      margin-left: 4px;

      vertical-align: -3px;

      background: var(--cyan);

      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .footer {
      margin-top: 60px;

      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;

      color: var(--muted);
      font-size: 11px;
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: var(--cyan);
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .terminal {
        min-height: 470px;
      }

      .terminal-body {
        padding: 38px 22px;
      }

      .terminal-title {
        display: none;
      }

      .footer {
        margin-top: 45px;
      }
    }
  </style>
</head>

<body>

  <main class="terminal">

    <header class="terminal-header">
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div class="terminal-title">
        saibuilds.dev — bash
      </div>
    </header>

    <section class="terminal-body">

      <div class="intro">

        <div>
          <span class="prompt">$</span>
          <span class="command"> whoami</span>
        </div>

        <div class="brand">
          sai<span>builds</span>.dev
        </div>

        <div class="role">
          DevOps Engineer · Builder · Tinkerer
        </div>

      </div>


      <div class="status">

        <div class="status-line">
          <span class="prompt">$</span>
          <span class="command">./deploy-website</span>
        </div>

        <div class="status-line">
          <span class="warning">⟳</span>
          <span>deployment in progress...</span>
        </div>

        <br />

        <div class="status-line">
          <span class="success">✓</span>
          <span>infrastructure</span>
          <span class="comment">[ready]</span>
        </div>

        <div class="status-line">
          <span class="success">✓</span>
          <span>ideas</span>
          <span class="comment">[too many]</span>
        </div>

        <div class="status-line">
          <span class="warning">⟳</span>
          <span>website</span>
          <span class="comment">[still building]</span>
        </div>

        <br />

        <div class="joke">
          // shipping soon — just fixing one more thing™
        </div>

        <div style="margin-top: 22px;">
          <span class="prompt">$</span>
          <span class="cursor"></span>
        </div>

      </div>


      <footer class="footer">
        <span>status: <span class="success">building</span></span>

        <a href="mailto:rspraneethchandra@gmail.com">
          rspraneethchandra@gmail.com
        </a>
      </footer>

    </section>

  </main>

</body>
</html>
